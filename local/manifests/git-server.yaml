apiVersion: v1
kind: Namespace
metadata:
  name: git-server
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: git-server
  labels:
    app.kubernetes.io/name: git-server
spec:
  selector:
    app.kubernetes.io/name: git-server
  ports:
    - name: git
      port: 9418
      targetPort: git
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: git-server
  labels:
    app.kubernetes.io/name: git-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: git-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: git-server
    spec:
      containers:
        - name: git
          image: alpine/git:2.49.1
          ports:
            - name: git
              containerPort: 9418
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mkdir -p /srv/git/platform.git
              if [ ! -f /srv/git/platform.git/HEAD ]; then
                git init --bare /srv/git/platform.git
                git --git-dir=/srv/git/platform.git symbolic-ref HEAD refs/heads/main
              fi
              exec git daemon --reuseaddr --base-path=/srv/git --export-all \
                --enable=receive-pack --listen=0.0.0.0 --port=9418 --verbose
          readinessProbe:
            tcpSocket:
              port: git
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: false
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
