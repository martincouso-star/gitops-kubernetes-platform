name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: terraform and manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: ./scripts/install-ci-tools.sh "${RUNNER_TEMP}/bin"

      - name: Put tools on PATH
        run: |
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Run CI checks
        run: make ci
