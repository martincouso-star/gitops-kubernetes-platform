apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-app
spec:
  tls:
    - hosts:
        - sample.localtest.me
      secretName: sample-app-tls
  rules:
    - host: sample.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-app
                port:
                  number: 8080
