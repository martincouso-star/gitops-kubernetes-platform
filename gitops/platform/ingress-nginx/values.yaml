controller:
  replicaCount: 2
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
  config:
    ssl-redirect: "true"
    use-forwarded-headers: "true"
  metrics:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  admissionWebhooks:
    certManager:
      enabled: true
