apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../argocd/projects
  - ../../argocd/applications
patches:
  - path: delete-external-dns.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: cluster-namespaces
    patch: |-
      - op: replace
        path: /spec/source/repoURL
        value: git://git-server.git-server.svc.cluster.local/platform.git
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: ingress-nginx
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/gitops/platform/ingress-nginx/values-local.yaml
      - op: replace
        path: /spec/sources/1/repoURL
        value: git://git-server.git-server.svc.cluster.local/platform.git
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: cert-manager
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/gitops/platform/cert-manager/values-local.yaml
      - op: replace
        path: /spec/sources/1/repoURL
        value: git://git-server.git-server.svc.cluster.local/platform.git
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: monitoring
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/gitops/platform/monitoring/values-local.yaml
      - op: replace
        path: /spec/sources/1/repoURL
        value: git://git-server.git-server.svc.cluster.local/platform.git
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: gatekeeper
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/gitops/platform/gatekeeper/values-local.yaml
      - op: replace
        path: /spec/sources/1/repoURL
        value: git://git-server.git-server.svc.cluster.local/platform.git
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: gatekeeper-policies
    patch: |-
      - op: replace
        path: /spec/source/repoURL
        value: git://git-server.git-server.svc.cluster.local/platform.git
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: platform-config
    patch: |-
      - op: replace
        path: /spec/source/repoURL
        value: git://git-server.git-server.svc.cluster.local/platform.git
      - op: replace
        path: /spec/source/path
        value: gitops/platform/platform-config/overlays/local
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: sample-app
    patch: |-
      - op: replace
        path: /spec/source/repoURL
        value: git://git-server.git-server.svc.cluster.local/platform.git
      - op: replace
        path: /spec/source/path
        value: gitops/workloads/sample-app/overlays/local
