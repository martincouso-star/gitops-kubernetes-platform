apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../argocd/projects
  - ../../argocd/applications
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: ingress-nginx
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/gitops/platform/ingress-nginx/values-dev.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: cert-manager
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/gitops/platform/cert-manager/values-dev.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: external-dns
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/gitops/platform/external-dns/values-dev.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: monitoring
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/gitops/platform/monitoring/values-dev.yaml
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: gatekeeper
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/gitops/platform/gatekeeper/values-dev.yaml
